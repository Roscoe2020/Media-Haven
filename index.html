<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaxing Media Haven - Full Stack</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F4F1EA] text-[#2C2523] min-h-screen p-4 md:p-8 font-sans text-base leading-relaxed selection:bg-[#E2D9CC]">
  <div class="max-w-6xl mx-auto">
    
    <!-- Auth Bar -->
    <div id="authContainer" class="bg-[#FAF8F5] border border-[#E2D9CC] rounded-xl p-4 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-sm">
      <div id="userInfo" class="text-sm font-semibold text-[#5C4E43]">
        🔒 Not logged in (Guest Mode / Off-cloud)
      </div>
      
      <div id="authForms" class="flex flex-wrap gap-2 items-center">
        <input type="email" id="authEmail" placeholder="Email" class="bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg px-3 py-1.5 text-sm">
        <input type="password" id="authPassword" placeholder="Password" class="bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg px-3 py-1.5 text-sm">
        <button onclick="handleLogin()" class="bg-[#5C4E43] hover:bg-[#4A3E3D] text-[#FAF8F5] px-3 py-1.5 rounded-lg text-sm font-bold transition">Login</button>
        <button onclick="handleSignUp()" class="bg-[#EFECE6] hover:bg-[#E2D9CC] text-[#332D29] px-3 py-1.5 rounded-lg border border-[#D8D0C5] text-sm font-bold transition">Sign Up</button>
      </div>

      <button id="logoutBtn" onclick="handleLogout()" class="hidden bg-rose-700 hover:bg-rose-800 text-white px-3 py-1.5 rounded-lg text-sm font-bold transition">
        Logout
      </button>
    </div>

    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 border-b-2 border-[#D8D0C5] pb-4 gap-4">
      <div>
        <h1 class="text-4xl font-extrabold text-[#4A3E3D] tracking-tight">
          My Media Haven
        </h1>
        <p class="text-sm text-[#7A6E65] mt-1 font-medium">Cloud-Synced Movies, TV Series, Anime, Books, and Manga</p>
      </div>
      
      <div class="flex gap-3 text-sm font-semibold">
        <button onclick="exportData()" class="bg-[#EFECE6] hover:bg-[#E2D9CC] text-[#332D29] px-4 py-2.5 rounded-lg border border-[#D8D0C5] shadow-sm transition">
          📥 Export Backup
        </button>
        <label class="bg-[#EFECE6] hover:bg-[#E2D9CC] text-[#332D29] px-4 py-2.5 rounded-lg border border-[#D8D0C5] shadow-sm transition cursor-pointer">
          📤 Import Backup
          <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
        </label>
      </div>
    </header>

    <!-- Main Form -->
    <form id="mediaForm" class="bg-[#FAF8F5] border border-[#E2D9CC] p-6 rounded-xl shadow-md mb-8 grid grid-cols-1 md:grid-cols-3 gap-5">
      <input type="hidden" id="editItemId">

      <div class="md:col-span-2">
        <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Title</label>
        <input type="text" id="title" required placeholder="e.g., Frieren, Dune, One Piece..." class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
      </div>

      <div>
        <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Category / Type</label>
        <select id="type" onchange="toggleEpisodeFields()" class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
          <option value="Movie">🍿 Movie</option>
          <option value="TV Series">📺 TV Series</option>
          <option value="Anime">🌸 Anime</option>
          <option value="Book">📚 Book</option>
          <option value="Manga">📖 Manga</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Status</label>
        <select id="status" class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
          <option value="Plan to Watch/Read">🗓️ Plan to Watch / Read</option>
          <option value="Currently Watching/Reading">⏳ Currently Watching / Reading</option>
          <option value="Finished">✅ Finished</option>
          <option value="Did Not Finish">🚫 Did Not Finish (DNF)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Rating (1-5 Stars)</label>
        <select id="rating" class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
          <option value="0">Unrated</option>
          <option value="5">⭐⭐⭐⭐⭐ (5.0)</option>
          <option value="4.5">⭐⭐⭐⭐½ (4.5)</option>
          <option value="4">⭐⭐⭐⭐☆ (4.0)</option>
          <option value="3.5">⭐⭐⭐½☆ (3.5)</option>
          <option value="3">⭐⭐⭐☆☆ (3.0)</option>
          <option value="2.5">⭐⭐½☆☆ (2.5)</option>
          <option value="2">⭐⭐☆☆☆ (2.0)</option>
          <option value="1.5">⭐½☆☆☆ (1.5)</option>
          <option value="1">⭐☆☆☆☆ (1.0)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Start / Release Date</label>
        <input type="date" id="startDate" class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
      </div>

      <div>
        <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Finish Date</label>
        <input type="date" id="finishDate" class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
      </div>

      <div id="epFields" class="hidden md:col-span-3 grid grid-cols-1 sm:grid-cols-2 gap-4 bg-[#EFECE6] p-4 rounded-lg border border-[#D8D0C5]">
        <div>
          <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Seasons Count</label>
          <input type="number" id="seasons" placeholder="e.g. 3" class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-2.5 text-base text-[#2C2523]">
        </div>
        <div>
          <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Total Episodes / Chapters</label>
          <input type="number" id="episodes" placeholder="e.g. 24" class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-2.5 text-base text-[#2C2523]">
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Series / Collection Name</label>
        <input type="text" id="seriesGroup" placeholder="e.g., MCU, Cosmere, Season 1" class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
      </div>

      <div>
        <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Tags (comma-separated)</label>
        <input type="text" id="tags" placeholder="e.g., Sci-Fi, Action, Cozy" class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
      </div>

      <div>
        <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Cover Image URL (Optional)</label>
        <input type="url" id="coverUrl" placeholder="Auto-fetched via API if empty" class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
      </div>

      <div class="md:col-span-3">
        <label class="block text-sm font-bold uppercase text-[#5C4E43] mb-1">Notes / Summary / Review</label>
        <textarea id="notes" rows="3" placeholder="Write your thoughts..." class="w-full bg-[#F4F1EA] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]"></textarea>
      </div>

      <div class="md:col-span-3 flex gap-3">
        <button type="submit" id="submitBtn" class="flex-1 bg-[#5C4E43] hover:bg-[#4A3E3D] text-[#FAF8F5] font-bold text-lg py-3 rounded-lg transition shadow-md">
          + Save Entry
        </button>
        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-[#EFECE6] hover:bg-[#E2D9CC] text-[#5C4E43] font-bold px-5 py-3 rounded-lg border border-[#D8D0C5]">
          Cancel Edit
        </button>
      </div>
    </form>

    <!-- Filters -->
    <div class="flex flex-col sm:flex-row gap-4 mb-6">
      <input type="text" id="searchInput" placeholder="Search by title, series, or tags..." oninput="renderLibrary()" class="flex-1 bg-[#FAF8F5] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
      
      <select id="filterType" onchange="renderLibrary()" class="bg-[#FAF8F5] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
        <option value="All">All Categories</option>
        <option value="Movie">Movies</option>
        <option value="TV Series">TV Series</option>
        <option value="Anime">Anime</option>
        <option value="Book">Books</option>
        <option value="Manga">Manga</option>
      </select>

      <select id="filterRating" onchange="renderLibrary()" class="bg-[#FAF8F5] border border-[#D8D0C5] rounded-lg p-3 text-base text-[#2C2523] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]">
        <option value="All">All Ratings</option>
        <option value="4.5">4.5+ Stars</option>
        <option value="4">4.0+ Stars</option>
        <option value="3">3.0+ Stars</option>
      </select>
    </div>

    <!-- Media Library Grid -->
    <div id="mediaGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </div>

  <!-- Detail Modal -->
  <div id="detailModal" onclick="handleModalClick(event)" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[#FAF8F5] border border-[#E2D9CC] rounded-xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-[#7A6E65] hover:text-[#2C2523] text-xl font-bold">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Firebase Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔑 Insert your Firebase configuration details here
     const firebaseConfig = {
  apiKey: "AIzaSyDjG8LfQ3LWiXAOktjSx7UWC1qTLjMyly8",
  authDomain: "media-tracker-14d70.firebaseapp.com",
  projectId: "media-tracker-14d70",
  storageBucket: "media-tracker-14d70.firebasestorage.app",
  messagingSenderId: "373578519059",
  appId: "1:373578519059:web:3fe39f25843f343fe8e5e6",
  measurementId: "G-45728ENTPN"
};

    // TMDB API Read Access Token or V3 Key (Optional for Movie/TV Auto Covers)
    const TMDB_API_KEY = "YOUR_TMDB_API_KEY";

    let auth, db, currentUser = null, unsubscribeSnapshot = null;
    let library = JSON.parse(localStorage.getItem('mediaHavenLibrary')) || [];

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        const userInfo = document.getElementById('userInfo');
        const authForms = document.getElementById('authForms');
        const logoutBtn = document.getElementById('logoutBtn');

        if (user) {
          userInfo.innerHTML = `👤 Logged in as: <strong class="text-[#2C2523]">${user.email}</strong> (Cloud Sync Active)`;
          authForms.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
          listenToCloudLibrary(user.uid);
        } else {
          userInfo.innerHTML = `🔒 Off-cloud Mode (Local Browser Storage)`;
          authForms.classList.remove('hidden');
          logoutBtn.classList.add('hidden');
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          library = JSON.parse(localStorage.getItem('mediaHavenLibrary')) || [];
          window.renderLibrary();
        }
      });
    } catch (e) {
      console.warn("Firebase initialized in fallback offline mode.");
    }

    // Auto Cover Fetcher APIs
    async function fetchCoverAPI(title, type) {
      try {
        if (type === 'Book' || type === 'Manga') {
          const res = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&limit=1`);
          const data = await res.json();
          if (data.docs?.[0]?.cover_i) {
            return `https://covers.openlibrary.org/b/id/${data.docs[0].cover_i}-M.jpg`;
          }
        }
        
        if (type === 'Anime') {
          const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(title)}&limit=1`);
          const data = await res.json();
          if (data.data?.[0]?.images?.jpg?.image_url) {
            return data.data[0].images.jpg.image_url;
          }
        }

        if ((type === 'Movie' || type === 'TV Series') && TMDB_API_KEY !== "YOUR_TMDB_API_KEY") {
          const endpoint = type === 'Movie' ? 'movie' : 'tv';
          const res = await fetch(`https://api.themoviedb.org/3/search/${endpoint}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}`);
          const data = await res.json();
          if (data.results?.[0]?.poster_path) {
            return `https://image.tmdb.org/t/p/w500${data.results[0].poster_path}`;
          }
        }
      } catch (e) {
        console.error("Cover API error:", e);
      }
      return 'https://via.placeholder.com/300x450/EFECE6/5C4E43?text=No+Cover+Found';
    }

    function listenToCloudLibrary(uid) {
      const userMediaRef = collection(db, "users", uid, "media");
      unsubscribeSnapshot = onSnapshot(userMediaRef, (snapshot) => {
        library = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        localStorage.setItem('mediaHavenLibrary', JSON.stringify(library));
        window.renderLibrary();
      });
    }

    async function syncSaveItem(item) {
      if (currentUser && db) {
        await setDoc(doc(db, "users", currentUser.uid, "media", String(item.id)), item);
      } else {
        const index = library.findIndex(i => String(i.id) === String(item.id));
        if (index !== -1) library[index] = item;
        else library.push(item);
        localStorage.setItem('mediaHavenLibrary', JSON.stringify(library));
        window.renderLibrary();
      }
    }

    async function syncDeleteItem(id) {
      if (currentUser && db) {
        await deleteDoc(doc(db, "users", currentUser.uid, "media", String(id)));
      } else {
        library = library.filter(item => String(item.id) !== String(id));
        localStorage.setItem('mediaHavenLibrary', JSON.stringify(library));
        window.renderLibrary();
      }
    }

    // Window-scoped Handlers
    window.handleSignUp = async function() {
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        alert("Account created successfully!");
      } catch (e) { alert(e.message); }
    };

    window.handleLogin = async function() {
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) { alert(e.message); }
    };

    window.handleLogout = async function() {
      await signOut(auth);
    };

    window.toggleEpisodeFields = function() {
      const type = document.getElementById('type').value;
      const epFields = document.getElementById('epFields');
      if (type === 'TV Series' || type === 'Anime' || type === 'Manga') {
        epFields.classList.remove('hidden');
      } else {
        epFields.classList.add('hidden');
      }
    };

    document.getElementById('mediaForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const editId = document.getElementById('editItemId').value;
      const title = document.getElementById('title').value;
      const type = document.getElementById('type').value;
      let cover = document.getElementById('coverUrl').value;

      if (!cover && !editId) {
        btn.innerText = 'Searching Cover API...';
        btn.disabled = true;
        cover = await fetchCoverAPI(title, type);
      }

      const itemData = {
        id: editId || Date.now().toString(),
        title: title,
        type: type,
        status: document.getElementById('status').value,
        rating: document.getElementById('rating').value,
        startDate: document.getElementById('startDate').value || 'N/A',
        finishDate: document.getElementById('finishDate').value || 'N/A',
        seasons: document.getElementById('seasons').value || null,
        episodes: document.getElementById('episodes').value || null,
        seriesGroup: document.getElementById('seriesGroup').value || 'Standalone',
        tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t !== ''),
        cover: cover || 'https://via.placeholder.com/300x450/EFECE6/5C4E43?text=No+Cover+Found',
        notes: document.getElementById('notes').value,
        rewatchHistory: editId ? (library.find(i => String(i.id) === String(editId))?.rewatchHistory || []) : []
      };

      await syncSaveItem(itemData);
      btn.disabled = false;
      window.resetForm();
    });

    window.addRewatchDate = async function(id) {
      const rewatchDate = prompt("Enter rewatch/reread date (YYYY-MM-DD):");
      if (rewatchDate) {
        const item = library.find(i => String(i.id) === String(id));
        if (item) {
          if (!item.rewatchHistory) item.rewatchHistory = [];
          item.rewatchHistory.push(rewatchDate);
          await syncSaveItem(item);
        }
      }
    };

    window.deleteItem = async function(id) {
      if (confirm("Are you sure you want to delete this item?")) {
        await syncDeleteItem(id);
      }
    };

    window.renderLibrary = function() {
      const grid = document.getElementById('mediaGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const typeFilter = document.getElementById('filterType').value;
      const ratingFilter = document.getElementById('filterRating').value;

      grid.innerHTML = '';

      const filtered = library.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(search) || 
                              (item.seriesGroup && item.seriesGroup.toLowerCase().includes(search)) ||
                              (item.tags && item.tags.some(t => t.toLowerCase().includes(search)));
        const matchesType = typeFilter === 'All' || item.type === typeFilter;
        
        let matchesRating = true;
        if (ratingFilter !== 'All') {
          matchesRating = parseFloat(item.rating || 0) >= parseFloat(ratingFilter);
        }

        return matchesSearch && matchesType && matchesRating;
      });

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `bg-[#FAF8F5] rounded-xl overflow-hidden shadow-sm border border-[#E2D9CC] flex flex-col justify-between`;

        card.innerHTML = `
          <div>
            <div class="relative h-60 w-full bg-[#EFECE6] cursor-pointer" onclick="openDetailModal('${item.id}')">
              <img src="${item.cover}" alt="${item.title}" class="w-full h-full object-cover">
              <span class="absolute top-2 left-2 text-xs font-bold px-2.5 py-1 rounded bg-[#F4F1EA]/95 text-[#2C2523] border border-[#D8D0C5] shadow-sm">
                ${item.status}
              </span>
            </div>
            
            <div class="p-5">
              <div class="flex justify-between items-start gap-2">
                <h3 onclick="openDetailModal('${item.id}')" class="text-xl font-bold text-[#2C2523] leading-snug cursor-pointer hover:underline">${item.title}</h3>
                <div class="flex gap-2">
                  <button onclick="editItem('${item.id}')" class="text-[#5C4E43] hover:text-[#2C2523] text-sm font-bold">Edit</button>
                  <button onclick="deleteItem('${item.id}')" class="text-[#A39589] hover:text-[#B85B56] text-base font-bold">✕</button>
                </div>
              </div>

              <div class="mt-1">
                <span class="text-amber-600 font-bold">★ ${item.rating || 0}</span> <span class="text-xs text-[#7A6E65]">(5.0 max)</span>
              </div>

              <p class="text-sm text-[#5C4E43] font-semibold mt-1">Series/Group: ${item.seriesGroup || 'Standalone'}</p>

              <div class="bg-[#F4F1EA] rounded p-3 text-xs space-y-1 my-3 text-[#544A42] border border-[#E2D9CC]">
                <p><strong>Start/Release:</strong> ${item.startDate}</p>
                <p><strong>Finished:</strong> ${item.finishDate}</p>
                ${item.rewatchHistory?.length ? `<p class="text-[#4E7357] font-semibold"><strong>Rewatched:</strong> ${item.rewatchHistory.length} time(s)</p>` : ''}
              </div>

              <div class="flex gap-2 mt-2">
                <button onclick="openDetailModal('${item.id}')" class="text-xs flex-1 bg-[#5C4E43] hover:bg-[#4A3E3D] text-[#FAF8F5] font-semibold py-2 rounded transition">
                  📖 Details
                </button>
                <button onclick="addRewatchDate('${item.id}')" class="text-xs bg-[#EFECE6] hover:bg-[#E2D9CC] text-[#2C2523] font-semibold px-3 py-2 rounded transition border border-[#D8D0C5]">
                  + Log Rewatch
                </button>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    };

    window.openDetailModal = function(id) {
      const item = library.find(i => String(i.id) === String(id));
      if (!item) return;

      document.getElementById('modalContent').innerHTML = `
        <div class="flex flex-col md:flex-row gap-6">
          <img src="${item.cover}" alt="${item.title}" class="w-full md:w-48 h-72 object-cover rounded-lg border border-[#D8D0C5]">
          <div class="flex-1 space-y-3">
            <span class="text-xs font-bold uppercase text-[#7A6E65]">${item.type}</span>
            <h2 class="text-3xl font-bold text-[#2C2523]">${item.title}</h2>
            <p class="text-sm font-semibold text-[#5C4E43]">Group: ${item.seriesGroup || 'Standalone'}</p>
            <p class="text-amber-600 font-bold">Rating: ${item.rating}/5</p>
            <div class="bg-[#F4F1EA] p-3 rounded-lg text-sm space-y-1 border border-[#E2D9CC]">
              <p><strong>Started:</strong> ${item.startDate}</p>
              <p><strong>Finished:</strong> ${item.finishDate}</p>
            </div>
          </div>
        </div>
        <div class="mt-4 border-t pt-4">
          <h4 class="font-bold text-sm uppercase text-[#5C4E43] mb-1">Notes</h4>
          <p class="bg-[#F4F1EA] p-3 rounded border border-[#E2D9CC] text-sm">${item.notes || 'No notes added.'}</p>
        </div>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
    };

    window.closeDetailModal = function() {
      document.getElementById('detailModal').classList.add('hidden');
    };

    window.handleModalClick = function(e) {
      if (e.target.id === 'detailModal') window.closeDetailModal();
    };

    window.editItem = function(id) {
      const item = library.find(i => String(i.id) === String(id));
      if (!item) return;

      document.getElementById('editItemId').value = item.id;
      document.getElementById('title').value = item.title;
      document.getElementById('type').value = item.type;
      document.getElementById('status').value = item.status;
      document.getElementById('rating').value = item.rating || "0";
      document.getElementById('startDate').value = item.startDate !== 'N/A' ? item.startDate : '';
      document.getElementById('finishDate').value = item.finishDate !== 'N/A' ? item.finishDate : '';
      document.getElementById('seasons').value = item.seasons || '';
      document.getElementById('episodes').value = item.episodes || '';
      document.getElementById('seriesGroup').value = item.seriesGroup !== 'Standalone' ? item.seriesGroup : '';
      document.getElementById('tags').value = item.tags ? item.tags.join(', ') : '';
      document.getElementById('coverUrl').value = item.cover.includes('placeholder') ? '' : item.cover;
      document.getElementById('notes').value = item.notes || '';

      document.getElementById('submitBtn').innerText = 'Update Entry';
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      window.toggleEpisodeFields();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.resetForm = function() {
      document.getElementById('mediaForm').reset();
      document.getElementById('editItemId').value = '';
      document.getElementById('submitBtn').innerText = '+ Save Entry';
      document.getElementById('cancelEditBtn').classList.add('hidden');
      window.toggleEpisodeFields();
    };

    window.exportData = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(library, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `media_haven_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    window.importData = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const importedLibrary = JSON.parse(e.target.result);
          if (Array.isArray(importedLibrary)) {
            for (const item of importedLibrary) {
              await syncSaveItem(item);
            }
            alert("Backup imported and synced successfully!");
          }
        } catch (err) {
          alert("Error reading backup file.");
        }
      };
      reader.readAsText(file);
    };

    window.renderLibrary();
  </script>
</body>
</html>
